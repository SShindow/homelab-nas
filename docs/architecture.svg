<svg viewBox="0 0 900 1090" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="1090" fill="#0f172a"/>

  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="600">Home NAS — Remote Access Architecture</text>

  <!-- Client devices -->
  <g>
    <rect x="40" y="90" width="180" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="120" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Windows Laptop</text>
    <text x="130" y="140" text-anchor="middle" fill="#94a3b8" font-size="12">Mapped Drive Z:</text>

    <rect x="40" y="190" width="180" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="220" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">iPhone</text>
    <text x="130" y="240" text-anchor="middle" fill="#94a3b8" font-size="12">Files App (SMB)</text>

    <rect x="40" y="290" width="180" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="320" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Galaxy Tab S7</text>
    <text x="130" y="340" text-anchor="middle" fill="#94a3b8" font-size="12">My Files (SMB)</text>
  </g>

  <text x="230" y="180" fill="#64748b" font-size="12">(different countries /</text>
  <text x="230" y="195" fill="#64748b" font-size="12">networks)</text>

  <!-- Arrows to Tailscale -->
  <line x1="220" y1="125" x2="380" y2="230" stroke="#38bdf8" stroke-width="2"/>
  <line x1="220" y1="225" x2="380" y2="230" stroke="#38bdf8" stroke-width="2"/>
  <line x1="220" y1="325" x2="380" y2="230" stroke="#38bdf8" stroke-width="2"/>

  <!-- Tailscale mesh -->
  <ellipse cx="460" cy="230" rx="90" ry="70" fill="#164e63" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="460" y="222" text-anchor="middle" fill="#f0fdfa" font-size="15" font-weight="700">Tailscale</text>
  <text x="460" y="240" text-anchor="middle" fill="#a5f3fc" font-size="11">WireGuard Mesh VPN</text>
  <text x="460" y="256" text-anchor="middle" fill="#a5f3fc" font-size="11">No port forwarding</text>

  <!-- Arrow to NAS -->
  <line x1="550" y1="230" x2="680" y2="230" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- NAS box -->
  <rect x="680" y="140" width="190" height="180" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2.5"/>
  <text x="775" y="170" text-anchor="middle" fill="#f0fdf4" font-size="16" font-weight="700">TrueNAS CE</text>
  <text x="775" y="192" text-anchor="middle" fill="#bbf7d0" font-size="12">Intel Pentium G3240</text>
  <text x="775" y="210" text-anchor="middle" fill="#bbf7d0" font-size="12">16GB DDR3</text>
  <line x1="700" y1="222" x2="850" y2="222" stroke="#334155" stroke-width="1"/>
  <text x="775" y="242" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">ZFS Mirror Pool</text>
  <text x="775" y="258" text-anchor="middle" fill="#bbf7d0" font-size="11">2x 2TB HDD</text>
  <text x="775" y="278" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">SMB Share: NAS-VN</text>
  <text x="775" y="296" text-anchor="middle" fill="#bbf7d0" font-size="11">128GB SSD (OS)</text>

  <!-- Google Drive backup module -->
  <rect x="680" y="400" width="190" height="90" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="2.5"/>
  <text x="775" y="428" text-anchor="middle" fill="#fefce8" font-size="15" font-weight="700">Google Drive</text>
  <text x="775" y="446" text-anchor="middle" fill="#fef08a" font-size="11">Important Files</text>
  <text x="775" y="464" text-anchor="middle" fill="#fef08a" font-size="11">folder</text>

  <line x1="775" y1="400" x2="775" y2="322" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrow-y)"/>
  <text x="835" y="365" fill="#fde68a" font-size="11" font-weight="600">PULL</text>
  <text x="835" y="380" fill="#fde68a" font-size="11">(COPY, one-way)</text>

  <defs>
    <marker id="arrow-y" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>

  <text x="775" y="333" text-anchor="middle" fill="#64748b" font-size="10">Cloud Sync Task (rclone)</text>

  <!-- Power resilience module -->
  <rect x="40" y="400" width="580" height="130" rx="10" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
  <text x="60" y="428" fill="#fecdd3" font-size="14" font-weight="700">⚡ Power-Loss Resilience</text>
  <text x="60" y="452" fill="#e2e8f0" font-size="12">Home fuse cut → power restored → router boots → NAS auto-boots</text>
  <text x="60" y="472" fill="#e2e8f0" font-size="12">→ Tailscale auto-reconnects — fully unattended, no smart plug/UPS/WoL</text>
  <text x="60" y="500" fill="#94a3b8" font-size="11">Root cause fixed: CMOS battery replacement + BIOS "Restore AC Power Loss"</text>
  <text x="60" y="516" fill="#94a3b8" font-size="11">(WoL ruled out — the fuse also cuts power to the router itself)</text>

  <!-- ZFS snapshot module -->
  <rect x="40" y="550" width="580" height="100" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="60" y="578" fill="#ddd6fe" font-size="14" font-weight="700">📸 ZFS Snapshots (local point-in-time recovery)</text>
  <text x="60" y="602" fill="#e2e8f0" font-size="12">Daily @ 02:00 · 7-day retention  |  Weekly @ Sun 03:00 · 4-week retention</text>
  <text x="60" y="624" fill="#94a3b8" font-size="11">Layered with Google Drive backup: cloud = off-site durability, snapshots = instant local recovery</text>

  <!-- Footer -->
  
  <!-- Exit node / personal VPN -->
  <g>
    <rect x="40" y="648" width="820" height="118" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="60" y="676" fill="#bae6fd" font-size="14" font-weight="700">🌐 Tailscale Exit Node (personal VPN egress)</text>
    <text x="60" y="700" fill="#e2e8f0" font-size="12">Client abroad → Tailscale → NAS → home router → VNPT → Internet — traffic exits with the home public IP</text>
    <text x="60" y="720" fill="#94a3b8" font-size="11">NAS advertises 0.0.0.0/0 + ::/0 · Host Network mode · IPv4/IPv6 forwarding sysctls · admin-approved in the tailnet</text>
    <text x="60" y="738" fill="#94a3b8" font-size="11">Verified by originating ASN change (AS7552 Viettel → AS45899 VNPT), no DNS leak, direct IPv6 peer-to-peer path</text>
    <text x="60" y="756" fill="#64748b" font-size="11">Line: ~155–170 Mbps upstream (international) · ~439 Mbps domestic · tunnel adds no measurable throughput penalty</text>
  </g>

  
  <!-- Camera NVR -->
  <g>
    <rect x="40" y="778" width="820" height="118" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="60" y="806" fill="#fbcfe8" font-size="14" font-weight="700">📹 Camera NVR (Frigate)</text>
    <text x="60" y="830" fill="#e2e8f0" font-size="12">Tapo C200 --RTSP--&gt; go2rtc --&gt; Frigate --&gt; ZFS pool. No vendor cloud, no SD card as primary storage.</text>
    <text x="60" y="850" fill="#94a3b8" font-size="11">Dual stream: 1080p record + 640x360 detect/audio · retention 7d continuous / 30d motion · DHCP-reserved camera IP</text>
    <text x="60" y="868" fill="#94a3b8" font-size="11">Reboot resilience verified from outside the LAN over Tailscale: NAS boot to live video, zero manual steps</text>
    <text x="60" y="886" fill="#64748b" font-size="11">319 MiB/hour per camera vs 80.2 MB/s pool write ceiling (&lt;1%) · 13-15% CPU · remote live view about 1.42 Mbps</text>
  </g>

  
  <!-- Observability -->
  <g>
    <rect x="40" y="908" width="820" height="118" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="60" y="936" fill="#fde68a" font-size="14" font-weight="700">📊 Observability (Prometheus + Grafana)</text>
    <text x="60" y="960" fill="#e2e8f0" font-size="12">node_exporter (host binary, :9100) --scrape 15s--&gt; Prometheus (:30104) --&gt; Grafana (:30037), reachable over Tailscale</text>
    <text x="60" y="980" fill="#94a3b8" font-size="11">~2,770 host metrics · 30d retention · config on a host-path dataset (ixVolume is wiped on reinstall)</text>
    <text x="60" y="998" fill="#94a3b8" font-size="11">Exporter runs on the host, not in a container, to keep the ZFS collector and real /proc and /sys visibility</text>
    <text x="60" y="1016" fill="#64748b" font-size="11">Auto-started by a Post Init script · reboot-verified, both scrape targets UP unattended · alerting not yet configured</text>
  </g>

  <text x="450" y="1050" text-anchor="middle" fill="#64748b" font-size="12">Client ↔ Tailscale VPN (encrypted mesh) ↔ NAS SMB share — no exposed public IP</text>
  <text x="450" y="1068" text-anchor="middle" fill="#64748b" font-size="12">Google Drive → NAS: scheduled one-way backup, adds/updates only, never deletes locally</text>
</svg>
